# 샘플 에피소드: 강남은 어떻게 부촌이 됐나
# 내레이션(text)은 AI 음성으로 읽히고, 자막도 자동으로 나뉩니다.
# visual.type: map(지도) / image(사진, 출처 필수) / card(큰 글씨 카드)

title: "60년 전 강남은 서울이 아니었다? 강남이 부촌이 된 3가지 이유"
hook:
  - "60년 전 강남은"
  - "서울이 아니었다?"

scenes:
  - text: "대한민국 땅값 1번지 강남. 그런데 60년 전엔 서울이 아니었습니다."
    visual:
      type: map
      center: [37.535, 127.005]
      zoom: 11
      markers:
        - { lat: 37.5663, lon: 126.9779, label: "서울시청" }
        - { lat: 37.4979, lon: 127.0276, label: "강남역" }

  - text: "1963년에야 서울에 편입됐고, 그 전엔 논밭과 배밭뿐인 시골이었죠."
    visual:
      type: card
      heading: "1963년"
      body: "경기도 광주군에서 서울로 편입"

  - text: "시작은 다리였습니다. 1969년 지금의 한남대교가 놓이며 강북과 이어졌어요."
    visual:
      type: map
      center: [37.5265, 127.0130]
      zoom: 14
      markers:
        - { lat: 37.5265, lon: 127.0130, label: "한남대교" }

  - text: "1970년엔 경부고속도로가 개통했는데, 서울 쪽 출발점이 바로 강남이었죠."
    visual:
      type: map
      center: [37.497, 127.030]
      zoom: 13
      lines:
        - points: [[37.5280, 127.0150], [37.5100, 127.0190], [37.4920, 127.0290], [37.4700, 127.0390]]
      markers:
        - { lat: 37.4700, lon: 127.0390, label: "경부고속도로" }

  - text: "강북이 너무 붐비자 서울시는 강북 개발을 묶고 강남 개발을 밀어줬습니다."
    visual:
      type: card
      heading: "강북 억제"
      body: "인구와 시설을 강남으로"

  - text: "결정타는 학교. 1976년 경기고를 시작으로 명문고들이 옮겨 오며 8학군이 생겼죠."
    visual:
      type: map
      center: [37.5170, 127.0480]
      zoom: 14
      markers:
        - { lat: 37.5170, lon: 127.0560, label: "경기고" }

  - text: "다리, 도로, 학교. 이 세 가지가 시골 마을을 최고의 부촌으로 만든 겁니다."
    visual:
      type: card
      heading: "다리 + 도로 + 학교"
      body: "= 지금의 강남"

# 검수 때 확인한 자료의 이름과 링크를 적으면 설명란에 들어갑니다.
sources:
  - "서울역사편찬원 자료 (검수하면서 링크 추가)"

# 업로드 전에 사람이 꼭 확인할 사실 (영상 만들 때 화면에 다시 보여 줍니다)
fact_check:
  - "강남 일대(언주면 등)가 1963년 1월 서울에 편입된 것이 맞는지"
  - "제3한강교(한남대교) 개통이 1969년 12월이 맞는지"
  - "경부고속도로 전 구간 개통이 1970년 7월이 맞는지"
  - "경기고등학교 강남(삼성동) 이전이 1976년이 맞는지"
  - "지도 표시 위치(경기고, 한남대교, 고속도로 선)가 실제와 맞는지"

hashtags: ["강남", "서울역사", "부동산", "지리", "shorts"]
